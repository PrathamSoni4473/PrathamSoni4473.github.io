<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bgn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123027"/>
      <stop offset="1" stop-color="#1A3D31"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgn)"/>

  <text x="70" y="110" font-family="Menlo, Consolas, monospace" font-size="30" letter-spacing="5" fill="#F3C878">DATA &amp; WEB INTERN · NIPPON COLOR, MUMBAI</text>

  <text x="70" y="250" font-size="96" fill="#F6F2E4">Find where</text>
  <text x="70" y="355" font-size="96" fill="#F6F2E4">it <tspan fill="#EBA83B" font-style="italic">leaks.</tspan></text>
  <text x="70" y="440" font-family="Menlo, Consolas, monospace" font-size="30" fill="#F6F2E4" fill-opacity="0.6">funnel fixed → +12% sales · −30% load · −18% bounce</text>

  <!-- conversion funnel -->
  <g font-family="Menlo, Consolas, monospace" font-size="24">
    <rect x="70" y="480" width="820" height="52" rx="26" fill="none" stroke="#F6F2E4" stroke-opacity="0.55" stroke-width="3"/>
    <text x="920" y="515" fill="#F6F2E4" fill-opacity="0.6">VISIT</text>

    <rect x="70" y="552" width="620" height="52" rx="26" fill="none" stroke="#F6F2E4" stroke-opacity="0.45" stroke-width="3"/>
    <text x="720" y="587" fill="#F6F2E4" fill-opacity="0.6">BROWSE</text>

    <rect x="70" y="624" width="380" height="52" rx="26" fill="none" stroke="#F3C878" stroke-opacity="0.7" stroke-width="3"/>
    <text x="480" y="659" fill="#F3C878">CART</text>
    <!-- the leak -->
    <path d="M560 610 q 14 26 0 52" fill="none" stroke="#EBA83B" stroke-width="4" stroke-dasharray="5 8"/>
    <circle cx="566" cy="676" r="8" fill="#EBA83B"/>
    <text x="596" y="668" fill="#EBA83B">↖ the leak</text>

    <rect x="70" y="696" width="250" height="52" rx="26" fill="#EBA83B"/>
    <text x="96" y="731" fill="#0C2018">PURCHASE</text>
    <text x="350" y="731" fill="#EBA83B">+12%</text>
  </g>
</svg>
