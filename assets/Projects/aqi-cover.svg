<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bgq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123027"/>
      <stop offset="1" stop-color="#1A3D31"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgq)"/>

  <text x="70" y="110" font-family="Menlo, Consolas, monospace" font-size="30" letter-spacing="5" fill="#F3C878">MUMBAI AQI · 6 STATIONS · 2020 – 2023</text>

  <text x="70" y="250" font-size="96" fill="#F6F2E4">Decompose,</text>
  <text x="70" y="355" font-size="96" fill="#F6F2E4"><tspan fill="#EBA83B" font-style="italic">then</tspan> predict.</text>
  <text x="70" y="440" font-family="Menlo, Consolas, monospace" font-size="30" fill="#F6F2E4" fill-opacity="0.6">STL → CNN-LSTM + RNN ensemble · R² 0.89 · IEEE</text>

  <!-- decomposition rows -->
  <g font-family="Menlo, Consolas, monospace" font-size="24">
    <text x="70" y="530" fill="#F6F2E4" fill-opacity="0.65">TREND</text>
    <path d="M240 540 C 340 520, 480 505, 640 498" fill="none" stroke="#F6F2E4" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>

    <text x="70" y="615" fill="#F6F2E4" fill-opacity="0.65">SEASONAL</text>
    <path d="M240 615 q 25 -30 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0" fill="none" stroke="#F6F2E4" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>

    <text x="70" y="700" fill="#F6F2E4" fill-opacity="0.65">RESIDUAL</text>
    <polyline points="240,700 265,688 290,706 315,692 340,704 365,690 390,703 415,694 440,708 465,691 490,702 515,693 540,705 565,695 590,701 615,690 640,700"
      fill="none" stroke="#F6F2E4" stroke-opacity="0.6" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- brace and forecast -->
  <path d="M690 500 h 26 v 200 h -26" fill="none" stroke="#F3C878" stroke-width="3.5"/>
  <path d="M740 600 h 52 M778 588 l 16 12 -16 12" fill="none" stroke="#EBA83B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="830" y="520" font-family="Menlo, Consolas, monospace" font-size="24" fill="#F3C878">FORECAST</text>
  <path d="M830 645 C 870 630, 900 590, 940 585 C 985 580, 1010 620, 1050 610 C 1090 600, 1105 565, 1130 555" fill="none" stroke="#EBA83B" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1130" cy="555" r="11" fill="#EBA83B"/>
</svg>
