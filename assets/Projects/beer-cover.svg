<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A3D31"/>
      <stop offset="1" stop-color="#123027"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgb)"/>

  <text x="70" y="110" font-family="Menlo, Consolas, monospace" font-size="30" letter-spacing="5" fill="#F3C878">150 PRODUCTS · 7 REGIONS · 5 CHANNELS</text>

  <text x="70" y="250" font-size="96" fill="#F6F2E4">Busy is not</text>
  <text x="70" y="355" font-size="96" fill="#EBA83B" font-style="italic">profitable.</text>
  <text x="70" y="440" font-family="Menlo, Consolas, monospace" font-size="30" fill="#F6F2E4" fill-opacity="0.6">zero overlap: top-10 volume vs top-10 margin</text>

  <!-- BCG quadrant -->
  <g>
    <rect x="70" y="480" width="1060" height="230" rx="14" fill="none" stroke="#F6F2E4" stroke-opacity="0.3" stroke-width="2.5"/>
    <line x1="600" y1="480" x2="600" y2="710" stroke="#F6F2E4" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="6 8"/>
    <line x1="70" y1="595" x2="1130" y2="595" stroke="#F6F2E4" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="6 8"/>

    <g font-family="Menlo, Consolas, monospace" font-size="24">
      <text x="95" y="516" fill="#F6F2E4" fill-opacity="0.55">QUESTION MARKS</text>
      <text x="1105" y="516" fill="#EBA83B" text-anchor="end">STARS ★</text>
      <text x="95" y="692" fill="#F6F2E4" fill-opacity="0.55">DOGS</text>
      <text x="1105" y="692" fill="#F6F2E4" fill-opacity="0.55" text-anchor="end">CASH COWS</text>
    </g>

    <!-- dogs: faded, bottom-left -->
    <g fill="#F6F2E4" fill-opacity="0.3">
      <circle cx="160" cy="640" r="9"/><circle cx="230" cy="665" r="8"/><circle cx="300" cy="632" r="9"/>
      <circle cx="365" cy="668" r="7"/><circle cx="430" cy="645" r="8"/><circle cx="500" cy="670" r="7"/>
    </g>
    <!-- question marks -->
    <g fill="#F3C878" fill-opacity="0.55">
      <circle cx="250" cy="545" r="9"/><circle cx="390" cy="525" r="8"/>
    </g>
    <!-- cash cows -->
    <g fill="#F6F2E4" fill-opacity="0.55">
      <circle cx="700" cy="645" r="10"/><circle cx="820" cy="668" r="9"/><circle cx="930" cy="640" r="10"/>
    </g>
    <!-- stars: gold, top-right -->
    <g fill="#EBA83B">
      <circle cx="700" cy="540" r="12"/><circle cx="790" cy="515" r="12"/><circle cx="880" cy="548" r="12"/>
      <circle cx="960" cy="522" r="12"/><circle cx="1040" cy="550" r="12"/>
    </g>
  </g>
</svg>
