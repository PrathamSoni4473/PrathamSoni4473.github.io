    <rect x="394" y="580" width="200" height="58" rx="29" fill="none" stroke="#EBA83B" stroke-width="3"/>
    <text x="494" y="618" fill="#EBA83B">MODERATE</text>
    <rect x="610" y="580" width="170" height="58" rx="29" fill="#EBA83B"/>
    <text x="695" y="618" fill="#0C2018">SEVERE</text>
