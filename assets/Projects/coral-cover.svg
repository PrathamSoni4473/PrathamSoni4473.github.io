  <rect width="1200" height="750" fill="url(#sea)"/>

  <text x="70" y="110" font-family="Menlo, Consolas, monospace" font-size="30" letter-spacing="5" fill="#F3C878">BCO-DMO REEF DATA · 1980 – 2020</text>

  <text x="70" y="250" font-size="96" fill="#F6F2E4">Which reefs</text>
  <text x="70" y="355" font-size="96" fill="#F6F2E4">bleach <tspan fill="#EBA83B" font-style="italic">worst?</tspan></text>
  <text x="70" y="440" font-family="Menlo, Consolas, monospace" font-size="30" fill="#F6F2E4" fill-opacity="0.6">21,418 obs · 5 models · PR-AUC 0.736</text>

  <!-- coral colony, gold -->
  <g stroke="#EBA83B" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M930 700 C 930 590, 920 545, 880 495 C 850 455, 845 400, 855 345"/>
    <path d="M930 700 C 935 600, 955 545, 1000 505 C 1040 468, 1050 410, 1042 355"/>
    <path d="M896 570 C 860 550, 830 518, 822 465"/>
    <path d="M963 590 C 1000 573, 1035 545, 1050 492"/>
    <path d="M855 345 C 840 312, 842 280, 856 252"/>
    <path d="M855 345 C 872 315, 874 282, 865 248"/>
    <path d="M1042 355 C 1030 320, 1034 288, 1050 259"/>
    <path d="M1042 355 C 1060 328, 1068 295, 1062 259"/>
  </g>
  <g fill="#F3C878">
    <circle cx="856" cy="247" r="10"/>
    <circle cx="867" cy="240" r="7"/>
    <circle cx="1051" cy="254" r="10"/>
    <circle cx="1063" cy="252" r="7"/>
    <circle cx="820" cy="460" r="8"/>
