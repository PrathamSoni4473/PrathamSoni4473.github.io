  <path d="M740 702 Q 940 678 1180 702" stroke="#F6F2E4" stroke-opacity="0.3" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- severity scale -->
  <g font-family="Menlo, Consolas, monospace" font-size="24" text-anchor="middle">
    <rect x="70" y="580" width="146" height="58" rx="29" fill="none" stroke="#F6F2E4" stroke-opacity="0.4" stroke-width="2.5"/>
    <text x="143" y="618" fill="#F6F2E4" fill-opacity="0.7">NONE</text>
    <rect x="232" y="580" width="146" height="58" rx="29" fill="none" stroke="#F3C878" stroke-opacity="0.6" stroke-width="2.5"/>
