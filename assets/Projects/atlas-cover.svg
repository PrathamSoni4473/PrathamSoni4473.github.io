<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123027"/>
      <stop offset="1" stop-color="#1A3D31"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>

  <text x="70" y="110" font-family="Menlo, Consolas, monospace" font-size="30" letter-spacing="5" fill="#F3C878">ABS RETAIL TRADE · SIX INDUSTRIES</text>

  <text x="70" y="250" font-size="96" fill="#F6F2E4">From the basket</text>
  <text x="70" y="355" font-size="96" fill="#F6F2E4">to the <tspan fill="#EBA83B" font-style="italic">economy.</tspan></text>
  <text x="70" y="440" font-family="Menlo, Consolas, monospace" font-size="30" fill="#F6F2E4" fill-opacity="0.6">LIVE · atlas-retail.streamlit.app</text>

  <!-- macro: monthly turnover with December spikes -->
  <g>
    <line x1="70" y1="690" x2="1130" y2="690" stroke="#F6F2E4" stroke-opacity="0.25" stroke-width="2"/>
    <polyline points="70,655 125,648 180,652 235,638 290,642 345,545 400,645 455,632 510,635 565,620 620,624 675,505 730,622 785,610 840,614 895,596 950,602 1005,462 1060,598 1115,585 1130,588"
      fill="none" stroke="#EBA83B" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#F3C878">
      <circle cx="345" cy="545" r="11"/>
      <circle cx="675" cy="505" r="11"/>
      <circle cx="1005" cy="462" r="11"/>
    </g>
    <g font-family="Menlo, Consolas, monospace" font-size="24" fill="#F3C878" text-anchor="middle">
      <text x="345" y="518">DEC</text>
      <text x="675" y="478">DEC</text>
      <text x="1005" y="435">DEC</text>
    </g>
  </g>

  <!-- micro: basket dot-grid -->
  <g fill="#F6F2E4" fill-opacity="0.35" transform="translate(880,120)">
    <circle cx="0" cy="0" r="7"/><circle cx="40" cy="0" r="7"/><circle cx="80" cy="0" r="7"/><circle cx="120" cy="0" r="7"/><circle cx="160" cy="0" r="7"/><circle cx="200" cy="0" r="7"/>
    <circle cx="0" cy="40" r="7"/><circle cx="40" cy="40" r="7" fill="#EBA83B" fill-opacity="1"/><circle cx="80" cy="40" r="7"/><circle cx="120" cy="40" r="7"/><circle cx="160" cy="40" r="7" fill="#EBA83B" fill-opacity="1"/><circle cx="200" cy="40" r="7"/>
    <circle cx="0" cy="80" r="7"/><circle cx="40" cy="80" r="7"/><circle cx="80" cy="80" r="7" fill="#EBA83B" fill-opacity="1"/><circle cx="120" cy="80" r="7"/><circle cx="160" cy="80" r="7"/><circle cx="200" cy="80" r="7"/>
  </g>
</svg>
