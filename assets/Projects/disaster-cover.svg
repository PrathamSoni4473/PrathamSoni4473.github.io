<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A3D31"/>
      <stop offset="1" stop-color="#123027"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgd)"/>

  <text x="70" y="110" font-family="Menlo, Consolas, monospace" font-size="30" letter-spacing="5" fill="#F3C878">53,531 CRISIS TWEETS · CRISISNLP</text>

  <text x="70" y="250" font-size="96" fill="#F6F2E4">Eyewitness,</text>
  <text x="70" y="355" font-size="96" fill="#F6F2E4">or <tspan fill="#EBA83B" font-style="italic">just noise?</tspan></text>
  <text x="70" y="440" font-family="Menlo, Consolas, monospace" font-size="30" fill="#F6F2E4" fill-opacity="0.6">BERT + FastText + GloVe → LSTM · 89.12% accuracy</text>

  <!-- bubbles -->
  <g font-family="Menlo, Consolas, monospace" font-size="24">
    <!-- eyewitness: gold, kept -->
    <g>
      <text x="120" y="520" fill="#EBA83B">EYEWITNESS ✓</text>
      <rect x="120" y="540" width="300" height="120" rx="26" fill="#EBA83B"/>
      <path d="M170 660 l 0 34 34 -34 Z" fill="#EBA83B"/>
      <rect x="150" y="574" width="220" height="12" rx="6" fill="#0C2018" opacity="0.75"/>
      <rect x="150" y="604" width="150" height="12" rx="6" fill="#0C2018" opacity="0.75"/>
    </g>
    <!-- sarcasm: faded -->
    <g>
      <text x="490" y="560" fill="#F6F2E4" fill-opacity="0.5">SARCASM ✕</text>
      <rect x="490" y="580" width="260" height="104" rx="26" fill="none" stroke="#F6F2E4" stroke-opacity="0.4" stroke-width="3"/>
      <path d="M535 684 l 0 30 30 -30" fill="none" stroke="#F6F2E4" stroke-opacity="0.4" stroke-width="3"/>
      <rect x="518" y="610" width="190" height="11" rx="5.5" fill="#F6F2E4" opacity="0.3"/>
      <rect x="518" y="638" width="120" height="11" rx="5.5" fill="#F6F2E4" opacity="0.3"/>
    </g>
    <!-- news: faded -->
    <g>
      <text x="820" y="520" fill="#F6F2E4" fill-opacity="0.5">NEWS ✕</text>
      <rect x="820" y="540" width="250" height="100" rx="26" fill="none" stroke="#F6F2E4" stroke-opacity="0.4" stroke-width="3"/>
      <path d="M1020 640 l 0 30 -30 -30" fill="none" stroke="#F6F2E4" stroke-opacity="0.4" stroke-width="3"/>
      <rect x="848" y="568" width="180" height="11" rx="5.5" fill="#F6F2E4" opacity="0.3"/>
      <rect x="848" y="596" width="115" height="11" rx="5.5" fill="#F6F2E4" opacity="0.3"/>
    </g>
  </g>
</svg>
